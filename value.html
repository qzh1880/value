<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身价榜 | Jincai League</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#ffffff;
            color:#111;
            font-family:'Times New Roman','Noto Serif SC',serif;
            padding:36px 18px;
            max-width:820px;
            margin:0 auto;
            line-height:1.65;
        }
        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#111;
            text-decoration:none;
            border-bottom:1px solid #999;
        }
        .back:hover{
            border-bottom-color:#111;
        }
        .tab-box{
            display:flex;
            gap:10px;
            margin-bottom:26px;
        }
        .tab{
            padding:10px 22px;
            background:#fff;
            border:1px solid #111;
            cursor:pointer;
            transition:0.2s;
        }
        .tab.active{
            background:#333333;
            color:#fff;
        }
        .tab-content{display:none;}
        .tab-content.show{display:block;}
        h1{
            text-align:center;
            color:#111;
            margin-bottom:28px;
            font-size:28px;
            font-weight:bold;
        }
        .rank-card{
            border:1px solid #222;
        }
        .rank-header{
            display:grid;
            grid-template-columns:60px 1fr 160px;
            padding:14px 20px;
            background:#333333;
            color:#fff;
            font-weight:bold;
        }
        .rank-item{
            display:grid;
            grid-template-columns:60px 1fr 160px;
            padding:16px 20px;
            border-bottom:1px solid #ddd;
            align-items:center;
        }
        .rank-num{font-weight:bold;font-size:18px;}
        .rank-name{font-size:17px;color:#111;}
        .rank-desc{font-size:14px;color:#555;margin-top:4px;}
        .rank-score{text-align:center;font-weight:bold;color:#111;font-size:17px;}
        .rank-header div:last-child{text-align:center;}
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <div class="tab-box">
        <div class="tab active" data-tab="player">个人身价榜</div>
        <div class="tab" data-tab="team">球队身价榜</div>
    </div>

    <div class="tab-content show" id="player">
        <h1>个人身价榜</h1>
        <div class="rank-card">
            <div class="rank-header">
                <div>名次</div>
                <div>球员（球队）</div>
                <div>身价（亿进元券）</div>
            </div>
            <div id="playerWrap"></div>
        </div>
    </div>

    <div class="tab-content" id="team">
        <h1>球队身价榜</h1>
        <div class="rank-card">
            <div class="rank-header">
                <div>名次</div>
                <div>球队</div>
                <div>总身价（亿进元券）</div>
            </div>
            <div id="teamWrap"></div>
        </div>
    </div>
<script>
const tabs = document.querySelectorAll('.tab');
tabs.forEach(t=>{
    t.onclick = ()=>{
        tabs.forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('show'));
        document.getElementById(t.dataset.tab).classList.add('show');
    }
})

const sortedPlayer = playerData.sort((a,b)=>b.score - a.score);
const pWrap = document.getElementById("playerWrap");
sortedPlayer.forEach((item, index)=>{
    const rank = index + 1;
    const div = document.createElement("div");
    div.className = "rank-item";
    div.innerHTML = `
        <div class="rank-num">${rank}</div>
        <div>

            <div class="rank-desc">${item.desc}</div>
        </div>

})
