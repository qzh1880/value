<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jincai League</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#ffffff;
            color:#111111;
            font-family:'Times New Roman','Noto Serif SC',serif;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px;
        }
        .logo-wrap{
            display:flex;
            align-items:center;
            gap:16px;
            margin-bottom:60px;
        }
        .logo-text{
            font-size:52px;
            font-weight:bold;
            letter-spacing:2px;
        }
        .btn-group{
            display:flex;
            flex-direction:column;
            gap:16px;
            width:100%;
            max-width:360px;
        }
        .btn{
            display:block;
            width:100%;
            padding:16px;
            text-align:center;
            background:#fff;
            border:1px solid #333333;
            color:#111;
            font-size:20px;
            text-decoration:none;
            transition:0.22s ease;
        }
        .btn:hover{
            background:#333333;
            color:#fff;
        }
    </style>
</head>
<body>
    <div class="logo-wrap">
        <span class="logo-text">Jincai League</span>
    </div>
    <div class="btn-group">
        <a href="value.html" class="btn">身价榜</a>
        <a href="stat.html" class="btn">数据榜</a>
        <a href="golden.html" class="btn">金球奖</a>
    </div>
</body>
</html>
