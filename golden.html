<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金球奖 | Jincai League</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#ffffff;
            color:#111;
            font-family:'Times New Roman','Noto Serif SC',serif;
            padding:36px 18px;
            max-width:820px;
            margin:0 auto;
            line-height:1.65;
        }
        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#111;
            text-decoration:none;
            border-bottom:1px solid #999;
        }
        .back:hover{
            border-bottom-color:#111;
        }
        h1{
            text-align:center;
            color:#111;
            margin-bottom:28px;
            font-size:28px;
            font-weight:bold;
        }
        .rank-card{
            border:1px solid #222;
        }
        .rank-header{
            display:grid;
            grid-template-columns:60px 1fr 160px;
            padding:14px 20px;
            background:#333333;
            color:#fff;
            font-weight:bold;
        }
        .rank-item{
            display:grid;
            grid-template-columns:60px 1fr 160px;
            padding:16px 20px;
            border-bottom:1px solid #ddd;
            align-items:center;
        }
        .rank-num{font-weight:bold;font-size:18px;}
        .rank-name{font-size:17px;color:#111;}
        .rank-desc{font-size:14px;color:#555;margin-top:4px;}
        .rank-score{text-align:center;font-weight:bold;color:#111;font-size:17px;}
        .rank-header div:last-child{text-align:center;}
    </style>
</head>
<body>
    <a href="index.html" class="back">← 返回首页</a>
    <h1>金球奖候选榜</h1>
    <div class="rank-card">
        <div class="rank-header">
            <div>名次</div>
            <div>球员（球队）</div>
            <div>积分</div>
        </div>
        <div id="goldenWrap"></div>
    </div>
<script>
const goldenData = [
    {name:"陈润东", desc:"7尔西", score:20},
    {name:"李胥霖", desc:"7尔西", score:10},
    {name:"徐文博", desc:"7尔西", score:10},
    {name:"梅一涵", desc:"7尔西", score:5},
    {name:"赵弘毅", desc:"上海曼巴", score:2},
    {name:"邹奕涵", desc:"上海曼巴", score:4},
    {name:"李奕宸", desc:"五花果福瑞", score:10},
    {name:"郭圣熙", desc:"五花果福瑞", score:8},
    {name:"戎耀", desc:"上海曼巴", score:20},
    {name:"周湫哲", desc:"五花果福瑞", score:5},
    {name:"王睿涵", desc:"上海曼巴", score:10},
    {name:"郭梓彤", desc:"7尔西", score:4},
];
const sortedGolden = goldenData.sort((a,b)=>b.score - a.score);
const gWrap = document.getElementById("goldenWrap");
sortedGolden.forEach((item, index)=>{
    const rank = index + 1;
    const div = document.createElement("div");
    div.className = "rank-item";
    div.innerHTML = `
        <div class="rank-num">${rank}</div>
        <div>
            <div class="rank-name">${item.name}</div>
            <div class="rank-desc">${item.desc}</div>
        </div>
        <div class="rank-score">${item.score}</div>
    `;
    gWrap.appendChild(div);
})
</script>
</body>
</html>
